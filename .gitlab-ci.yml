stages:
  - build
  - docker
  - deploy

variables:
  GOPATH: $CI_PROJECT_DIR/.cache/go
  GOPROXY: direct
  DOCKER_IMAGE: images.registry.twcstorage.ru/util/notification-api
  DEPLOY_AGENT_URL: http://192.168.1.122:8099
  DEPLOY_SERVICE_NAME: notification-api

build:
  stage: build
  image: golang:1.25.11
  script:
    - GOOS=linux GOARCH=arm64 go build -o app cmd/main.go
  artifacts:
    paths:
      - app
    expire_in: 1 day
  cache:
    key: go-modules
    paths:
      - .cache/go/pkg/mod/
  tags:
    - docker

test:
  stage: build
  image: golang:1.24
  script:
    - go test -v ./...
  allow_failure: true
  cache:
    key: go-modules
    paths:
      - .cache/go/pkg/mod/
  tags:
    - docker

docker:
  stage: docker
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_SHA -t $DOCKER_IMAGE:latest .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHA
    - docker push $DOCKER_IMAGE:latest
  dependencies:
    - build
  only:
    - main
    - tags
  tags:
    - docker

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - |
      code=$(curl -s -o /tmp/deploy-response.json -w "%{http_code}" -X POST \
        -H "Authorization: Bearer $DEPLOY_TOKEN" \
        "$DEPLOY_AGENT_URL/deploy?service=$DEPLOY_SERVICE_NAME")
      cat /tmp/deploy-response.json
      echo
      if [ "$code" != "200" ]; then
        echo "deploy failed with HTTP $code"
        exit 1
      fi
  dependencies: [ ]
  only:
    - /^release\/.*$/
  tags:
    - docker
