include:
  - project: 'util8860911/ci/templates'
    ref: v1.0.3
    file: /stages.yml
  - project: 'util8860911/ci/templates'
    ref: v1.0.3
    file: /go.yml
  - project: 'util8860911/ci/templates'
    ref: v1.0.3
    file: /docker.yml
  - project: 'util8860911/ci/templates'
    ref: v1.0.3
    file: /deploy.yml

variables:
  DOCKER_IMAGE: images.registry.twcstorage.ru/util/notification-api
  DEPLOY_SERVICE_NAME: notification-api
  GO_MAIN_PATH: cmd/main.go
  GO_BUILD_ARCH: arm64

docker:
  extends: .docker_kaniko
  only:
    - main
    - tags
    - /^release\/.*$/

deploy:
  extends: .deploy_agent
  needs: [ "docker", "test" ]
  only:
    - /^release\/.*$/
